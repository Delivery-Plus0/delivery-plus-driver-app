url: ${APP_URL}
name: Driver signs out, and a reload stays signed out
tags:
  - session
---
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/reset
- runFlow: ../_shared/login.yaml
- tapOn:
    id: tab-profile
- tapOn:
    id: sign-out
- tapOn:
    id: sign-out-dialog-confirm
- extendedWaitUntil:
    visible:
      id: welcome-login
    timeout: 20000
# Signing out isn't an ended session: no "You have been signed out" screen.
- assertNotVisible:
    id: session-ended
# Both tokens are gone from this browser: a signed-in page sends the driver back to the welcome screen.
- openLink: ${APP_URL}/home
- extendedWaitUntil:
    visible:
      id: welcome-login
    timeout: 20000
- assertNotVisible:
    id: tab-today
