url: ${APP_URL}
name: Full delivery - driver goes online, gets the order automatically, picks it up and delivers it
tags:
  - business
---
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/reset
- runFlow: ../_shared/login.yaml
- tapOn:
    id: go-online
- extendedWaitUntil:
    visible:
      id: waiting-for-job
    timeout: 15000

# CUSTOMER + RESTAURANT (stand-ins: the runner orders as the QA customer and marks it ready as the
# QA restaurant). No dispatch step: the backend assigns this online driver by itself.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: scenario/order-ready

# DRIVER APP: the job arrives on the next poll (every 5 s).
- extendedWaitUntil:
    visible:
      id: current-delivery
    timeout: 30000
- assertVisible:
    id: driver-status
    text: On a delivery
- assertVisible: 'QA Kitchen'
- assertVisible: '1 Test Street, Apt 1'
- assertVisible: '.*QA Pasta'

# While on the job the app sends its position (fixed in the E2E build), and the customer can see it.
- extendedWaitUntil:
    visible:
      id: location-status
      text: Sharing your location with the customer
    timeout: 15000
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: tracking/assert-location

# The job card: step progress and a directions hand-off for both stops.
- assertVisible:
    id: delivery-progress
    text: 'Step 1 of 4 · To restaurant'
- assertVisible:
    id: pickup-maps
- assertVisible:
    id: drop-off-maps

# Every step is one-way, so it asks first. Cancelling changes nothing.
- tapOn:
    id: delivery-action-pickup
- extendedWaitUntil:
    visible:
      id: delivery-confirm
    timeout: 10000
- assertVisible: 'Picked up the order\?'
- tapOn:
    id: delivery-confirm-cancel
- assertNotVisible:
    id: delivery-confirm
- assertVisible:
    id: delivery-stage
    text: Go to the restaurant

- tapOn:
    id: delivery-action-pickup
- tapOn:
    id: delivery-confirm-confirm
- extendedWaitUntil:
    visible:
      id: delivery-action-start
    timeout: 15000
- assertVisible:
    id: delivery-progress
    text: 'Step 2 of 4 · Picked up'
- tapOn:
    id: delivery-action-start
- tapOn:
    id: delivery-confirm-confirm
- extendedWaitUntil:
    visible:
      id: delivery-action-complete
    timeout: 15000
- assertVisible:
    id: delivery-progress
    text: 'Step 3 of 4 · On the way'
- tapOn:
    id: delivery-action-complete
- tapOn:
    id: delivery-confirm-confirm

# Completing frees the driver: back to waiting, still online.
- extendedWaitUntil:
    visible:
      id: waiting-for-job
    timeout: 20000
- assertVisible:
    id: driver-status
    text: 'Online · waiting for a job'

# CROSS-APP: the order this driver delivered is DELIVERED for the customer.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: order/assert-delivered

# TODAY (#142): the count comes from the backend's history (earlier runs may have added more today).
- extendedWaitUntil:
    visible:
      id: today-completed
      text: '[0-9]+\+? deliver(y|ies) completed today'
    timeout: 20000

# HISTORY (#142): the delivery just completed is listed, Delivered, with its recorded stage times.
- tapOn:
    id: tab-history
- extendedWaitUntil:
    visible:
      id: history-item-${output.control.orderId}
    timeout: 20000
- assertVisible:
    id: history-item-${output.control.orderId}-status
    text: Delivered
# Filters: not among the cancelled ones; listed again under Completed.
- tapOn:
    id: history-filter-cancelled
- assertNotVisible:
    id: history-item-${output.control.orderId}
- tapOn:
    id: history-filter-completed
- extendedWaitUntil:
    visible:
      id: history-item-${output.control.orderId}
    timeout: 15000
# Detail sheet: stage times, drop-off and total from the backend.
- tapOn:
    id: history-item-${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: history-detail
    timeout: 10000
- assertVisible:
    id: history-detail-status
    text: Delivered
- assertVisible: 'Assigned'
- assertVisible: 'Picked up'
- assertVisible:
    id: history-detail-drop-off
    text: '1 Test Street, Apt 1'
- assertVisible:
    id: history-detail-total
    text: 'Order total .*'
- tapOn:
    id: history-detail-close
- assertNotVisible:
    id: history-detail
