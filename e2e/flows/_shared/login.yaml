# Shared: start from a clean browser state and sign in as ${EMAIL} (the QA driver).
url: ${APP_URL}/login
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- tapOn:
    id: login-email
- inputText: ${EMAIL}
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
- tapOn:
    id: login-submit
# Signed in: the tab bar (Today, History, Wallet, Profile) is up.
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 20000
