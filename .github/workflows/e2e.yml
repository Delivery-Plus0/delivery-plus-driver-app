name: E2E (Maestro)

# UI automation against a real, isolated backend:
#   backend repo → docker compose E2E stack (gateway :3100) → deterministic seed → web build of this
#   app (:8084) → Maestro (headless Chromium) → artifacts.
#
# - Pull requests run the smoke suite (sign-in, online/offline, new driver + vehicle, tabs + profile).
# - A nightly schedule and manual runs execute everything: smoke + the business flow (automatic
#   dispatch → pickup → start → complete → the customer's order is DELIVERED).
#
# Requires the backend branch in BACKEND_REF to allow the :8084 web origin in development
# (delivery-plus #111) and to provide docker-compose.e2e.yml and `npm run seed:e2e`.

on:
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        type: choice
        options: [smoke, business, all]
        default: all

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY || 'Delivery-Plus0/delivery-plus' }}
  BACKEND_REF: ${{ vars.BACKEND_REF || 'dev' }}
  E2E_API_URL: http://localhost:3100
  E2E_MANIFEST: ${{ github.workspace }}/backend/e2e-seed-manifest.json
  SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'all' }}

jobs:
  maestro-web:
    name: Maestro web (${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPOSITORY }}
          ref: ${{ env.BACKEND_REF }}
          path: backend

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Maestro needs Java 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start isolated E2E backend (fresh volumes)
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run e2e:env:up

      - name: Seed deterministic E2E data
        working-directory: backend
        run: npm run seed:e2e
        env:
          API_URL: ${{ env.E2E_API_URL }}

      - name: Install app
        run: npm ci --no-audit --no-fund

      - name: Run Maestro suite
        id: suite
        run: node e2e/scripts/run.mjs --suite "$SUITE" --build --headless

      # #34: the session suite needs short access tokens. Only auth-service changes; the data stays.
      - name: Restart auth-service with 60-second access tokens
        # Also after a failed main suite (its web build is reused), but not when the stack never started.
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        working-directory: backend
        env:
          JWT_EXPIRES_IN: 60s
        run: docker compose -p delivery-plus-e2e -f docker-compose.base.yml -f docker-compose.test.yml -f docker-compose.e2e.yml up -d --no-deps --wait --wait-timeout 180 auth-service

      - name: Run Maestro session suite (60-second access tokens)
        # Also after a failed main suite (its web build is reused), but not when the stack never started.
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        run: node e2e/scripts/run.mjs --suite session --headless

      - name: Collect backend logs
        if: failure()
        working-directory: backend
        run: |
          mkdir -p ../e2e/.artifacts/backend
          docker compose -p delivery-plus-e2e -f docker-compose.base.yml -f docker-compose.test.yml -f docker-compose.e2e.yml ps > ../e2e/.artifacts/backend/compose-ps.txt || true
          docker compose -p delivery-plus-e2e -f docker-compose.base.yml -f docker-compose.test.yml -f docker-compose.e2e.yml logs --no-color --tail=300 > ../e2e/.artifacts/backend/compose-logs.txt || true

      # JUnit reports always; screenshots/debug output are written for every flow and are most
      # useful on failure.
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ env.SUITE }}-${{ github.run_id }}
          path: e2e/.artifacts/
          # `.artifacts` is a hidden directory, which upload-artifact v4 skips unless told otherwise.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down E2E backend
        if: always()
        working-directory: backend
        run: npm run e2e:env:down
